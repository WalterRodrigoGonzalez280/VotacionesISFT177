services:
  php-apache:
    build:
      context: Dockerfiles/php-apache/
      dockerfile: Dockerfile.prod
    container_name: App_votacion
    env_file:
      - .env
    volumes:
      - ./www/:/var/www/html
    ports:
      - ${PHP_PORT}:80
    networks:
      - app-network

networks:
  app-network:
    name: aphd-2025_app-network
    driver: bridge