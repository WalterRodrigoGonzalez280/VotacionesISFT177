# Cabeceras de caché para los recursos estáticos.
#
# Apache ya envía ETag y Last-Modified, así que la respuesta siempre es
# revalidable; lo que faltaba era un Cache-Control que le dijera al navegador
# cuánto tiempo puede reutilizar la copia local sin preguntar.
#
# Por qué NO se usa `immutable` ni un max-age de un año: los assets no llevan
# hash en el nombre (href="css/tokens.css", sin ?v=), así que un navegador que
# ya se guardó el archivo no tiene forma de saber que cambió. Con `immutable`
# un cambio de CSS no llegaría a quien sirvió la versión vieja durante semanas.
# En su lugar se usa `must-revalidate`: pasado el max-age el navegador revalida
# contra el ETag y recibe un 304 vacío, que es prácticamente gratis frente a
# volver a bajar el archivo entero.
#
# Para endurecer esto en producción hay dos caminos: subir los max-age de acá
# y, sobre todo, pasar los assets a nombres con hash (tokens.<hash>.css), que es
# la condición para que `immutable` sea seguro. Mientras no haya hash, los
# valores de abajo priorizan "el cambio se ve rápido" sobre "cero requests".

<IfModule mod_headers.c>
    # Código: cambia seguido durante el desarrollo, así que una hora basta.
    # El 304 posterior es lo que hace que en la práctica no se note.
    <FilesMatch "\.(css|js)$">
        Header set Cache-Control "public, max-age=3600, must-revalidate"
    </FilesMatch>

    # Imágenes e iconos: cambian mucho menos, una semana es razonable.
    <FilesMatch "\.(png|webp|jpe?g|gif|svg|ico|woff2?|ttf|eot)$">
        Header set Cache-Control "public, max-age=604800, must-revalidate"
    </FilesMatch>

    # El HTML lo genera PHP y depende de la sesión (y lleva token CSRF), así que
    # no debe quedar en disco ni en proxies compartidos. `private` además de
    # `no-store` deja explícito que ni siquiera un caché intermedio lo guarde.
    <FilesMatch "\.php$">
        Header set Cache-Control "private, no-store, max-age=0"
    </FilesMatch>
</IfModule>
