# Compresión gzip para el texto.
#
# El repo ya comprime los .woff2 y los .png, así que acá solo falta el lado del
# texto: CSS, JS, HTML y SVG.
#
# mod_deflate es lo que baja el CSS de la ruta crítica de 53 KB a 12,7 KB. La
# medición (gzip -9, sobre los archivos de la landing):
#
#     base.css      42.406 -> 10.846   25%
#     fonts.css      6.263 ->  1.275   20%
#     landing.css    4.382 ->  1.337   30%
#     ------------------------------------------------------------------
#     total         53.051 -> 12.714   24%
#
# Son las tres hojas del <head>, y las tres son render-blocking: el navegador no
# pinta nada hasta que llegan y parsean. Sin esto, Lighthouse daba en mobile
# 2.720 ms de "retraso en la renderizacion del elemento" con un TTFB de 30 ms,
# o sea que el bloqueo era entero del cliente. El CSS comprime al 25%
# justamente porque es mayormente espacios y comentarios (los del "por que" de
# cada decisión, que son unos cuantos y no se tocan: ver el comentario del
# proyecto en base.css).
#
# NO se comprimen los .woff2: ya vienen comprimidos y deflate los agranda.
# Tampoco los .png y el .ico, que idem.
#
# Esto NO es brotli. Brotli rendiria ~15% menos todavia, pero mod_brotli no
# viene en la imagen de la php:7.4-apache y agregarlo exigiria compilarlo (el
# paquete no esta en Debian 10, y apt-get ya no funciona contra ese repo). Ver
# el comentario del Dockerfile.
#
# El IfModule es lo que hace que esto sea seguro: si el modulo no estuviera
# cargado, la pagina se sirve igual, sin comprimir.

<IfModule mod_deflate.c>
    # Lo que ya viene comprimido: volverlo a pasar por deflate no ahorra nada y
    # suma CPU. Son imagenes y fuentes, que ya van en un formato comprimido.
    # El .svg NO va en la lista: es texto y comprime muy bien (el sprite de
    # iconos es un SVG), asi que se comprime.
    SetEnvIfNoCase Request_URI \.(?:gif|jpe?g|png|webp|ico|woff2?|ttf|eot)$ no-gzip dont-vary

    <IfModule mod_filter.c>
        AddOutputFilterByType DEFLATE text/html text/plain text/xml text/css
        AddOutputFilterByType DEFLATE application/javascript text/javascript
        AddOutputFilterByType DEFLATE application/json application/xml
        AddOutputFilterByType DEFLATE image/svg+xml
    </IfModule>

    # Nivel 6 y no 9. El 9 rinde un 2-3% mas y el doble de CPU: en archivos
    # estaticos el costo se paga en cada revalidacion 304, y la mayoria de los
    # browsers dan por served el 6 igual.
    DeflateCompressionLevel 6
</IfModule>
